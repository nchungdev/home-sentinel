
  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon"><span class="mi" style="font-size:20px;">shield</span></div>
        <h2>Home Sentinel</h2>
      </div>
      <div class="nav-list">
        <div class="nav-item active" id="nav-agent" onclick="switchNav('agent', this)">
          <span class="mi">chat</span> Agent Chat
        </div>
        <div class="nav-item" id="nav-camera" onclick="switchNav('camera', this)">
          <span class="mi">videocam</span> Camera
        </div>
        <div class="nav-item" id="nav-automation" onclick="switchNav('automation', this)">
          <span class="mi">bolt</span> Kịch Bản
        </div>
        <div class="nav-item" id="nav-tvmodes" onclick="switchNav('tvmodes', this)">
          <span class="mi">tv</span> Chế độ TV
        </div>
      </div>
    </div>

    <!-- SETTING BOTTOM -->
    <div class="nav-bottom">
      <div class="nav-item" id="nav-setting" onclick="switchNav('setting', this)">
        <span class="mi">settings</span> Settings
      </div>
    </div>
  </aside>

  <!-- MAIN VIEW -->
  <main class="main-view is-agent-view">
    <div class="main-header">
      <h3 id="viewHeaderTitle" hidden>Agent Chat</h3>
      <div class="chat-header-content" id="chatHeaderContent">
        <div class="chat-header-copy">
          <h3 id="chatHeaderTitle">Xin chào 👋</h3>
          <p id="chatHeaderSubtitle">Bạn muốn bắt đầu từ đâu?</p>
        </div>
        <div class="chat-header-actions">
          <button type="button" class="chat-header-icon-button"
            onclick="createChatSession()" title="Cuộc trò chuyện mới"
            aria-label="Cuộc trò chuyện mới">
            <span class="mi" aria-hidden="true">add</span>
          </button>
          <button type="button" class="chat-header-icon-button"
            id="chatHistoryToggle" onclick="toggleChatHistory(event)"
            title="Lịch sử trò chuyện" aria-label="Lịch sử trò chuyện"
            aria-haspopup="dialog" aria-expanded="false"
            aria-controls="chatHistoryPopover">
            <span class="mi" aria-hidden="true">chat_bubble_outline</span>
          </button>
          <div class="chat-history-popover" id="chatHistoryPopover" hidden
            role="dialog" aria-label="Cuộc trò chuyện gần đây">
            <div class="chat-history-heading">Cuộc trò chuyện gần đây</div>
            <div class="chat-session-list" id="chatSessionList"></div>
            <div class="chat-session-status" id="chatSessionStatus" aria-live="polite"></div>
          </div>
        </div>
      </div>
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span>Sentinel</span>
      </div>
    </div>

    <!-- 1. AGENT VIEW (MINIMALIST MODERN CHAT) -->
    <div id="view-agent" class="view-content agent-view active">
      <section class="chat-workspace" aria-label="Hội thoại">
        <div class="chat-messages" id="chatList"></div>

        <div class="chat-input-wrapper">
          <div class="input-pill">
            <textarea id="promptInput" rows="1" placeholder="Hỏi điều gì đó hoặc ra lệnh điều khiển nhà..."></textarea>
            <button class="btn-send-round" onclick="sendChat()"><span class="mi">send</span></button>
          </div>
        </div>
      </section>
    </div>
